<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abbanero Studio</title>
    <link rel="icon" type="image/png" href="assets/star-favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="header-nav">
        <a href="index.html">Accueil</a>
        <a href="index.html">Portfiolo</a>
        <a href="index.html">Contact</a>
      </nav>
      <div class="header-title">
        <img class="logo" src="assets/logo-abbanero3.png" alt="" />
        <div style="margin: 2em">
          <h1 class="page-title">Abbanero Studio</h1>
          <h2 class="page-subtitle">Catalogue de Jeux gratuits en ligne</h2>
        </div>
      </div>
    </header>

    <form class="contact-form" action="#" method="post">
      <label for="email">Email :</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message :</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Envoyer</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
