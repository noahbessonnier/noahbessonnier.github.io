<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fish rod</title>
    <link rel="icon" type="image/png" href="assets/star-favicon.png" />
    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
      (function () {
        emailjs.init("KWLEDOMywicqGI8dN");
      })();
    </script>
  </head>

  <body>
    <div
      class="master-card"
      id="btnDownload"
      style="width: 500px; height: 100px"
    >
      <div style="padding: 0" class="master-card-details">
        <p style="font-size: 2.5em" class="master-text-title">Download</p>
        <!-- <p class="master-text-body">Télécharger le fichier ZIP</p> -->
      </div>
      <!-- <img class="master-image-icon" src="assets/fish-rod.png" alt="" /> -->
      <!-- <button style="width: 90%" class="master-card-button">Download</button> -->
    </div>
    <img
      src="assets/affiche.png"
      alt=""
      height="700px"
      style="margin: 20 px; border-radius: 7px"
    />

    <div id="installation" class="installation-guide">
      <h2>Guide d'installation</h2>

      <div class="steps">
        <div class="step">
          <p>1. Dans "Téléchargements" Extraire le contenu du dossier zip</p>
          <img
            src="assets/image tuto/Téléchargements _ Explorateur de fichiers 30_10_2025 19_03_08.png"
            alt="Étape de téléchargement"
          />
        </div>

        <div class="step">
          <p>2. Pour lancer le jeu, ouvrez le "Archipel de Luna.exe"</p>
          <img src="assets/image tuto/image.png" alt="Fichiers du jeu" />
        </div>

        <div class="step">
          <p>
            3. Lors de l'exécution, Windows peut afficher une alerte de
            sécurité. Cliquez sur "Informations Complémantaires" puis "Exécuter
            quand même"
          </p>
          <img
            src="assets/image tuto/Capture d’écran 2025-10-30 190529.png"
            alt="Alerte de sécurité"
          />
          <img
            src="assets/image tuto/Capture d’écran 2025-10-30 190554.png"
            alt="Alerte de sécurité"
          />
        </div>
      </div>
    </div>

    <style>
      .installation-guide {
        padding: 2rem;
        /* margin: 2rem 0; */
        color: #ed8f1f;
      }

      .steps {
        display: flex;
        flex-direction: row;
        gap: 4rem;
      }

      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 33%;
      }

      .step img {
        max-width: 600px;
        width: 80%;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        margin-bottom: 1rem;
      }

      .step p {
        font-size: 1.1rem;
        color: #ffffff;
      }
    </style>

    <script>
      document.getElementById("btnDownload").addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = "Archipel de Luna 0.4.zip";
        link.download = "Archipel de Luna 0.4.zip";
        link.click();

        const formData = {
          name: "Download",
          message: "Nouveau téléchargement de Fish Rod",
          date: new Date().toLocaleString(),
        };

        emailjs.send("service_mwkipu9", "template_u00nk2h", formData).then(
          function (response) {
            console.log("Email envoyé avec succès:", response);
          },
          function (error) {
            console.error("Erreur d'envoi:", error);
          },
        );

        // défilement
        const target = document.getElementById("installation");
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    </script>
  </body>
</html>
